[package]
name = "retrovaders"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "An authentic recreation of the 1978 Space Invaders arcade game"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mabroor/retrovaders"
keywords = ["game", "retro", "space-invaders", "arcade"]
categories = ["games"]

[dependencies]
# Game engine - simple, fast compile, cross-platform
macroquad = "0.4"

# Serialization for high scores and settings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random number generation for invader shooting, UFO spawns
rand = "0.8"

# Cross-platform directory handling for save files
dirs = "5.0"

[dev-dependencies]
# Testing utilities
pretty_assertions = "1.4"

[profile.release]
# Optimize for size and speed
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Faster debug builds
opt-level = 1

[profile.dev.package."*"]
# Optimize dependencies even in debug
opt-level = 3
